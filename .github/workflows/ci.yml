---
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/zigsetup-action@v4
        with:
          zig-version: "0.16.0"
      - name: Compile the library and run the test suite
        run: |
          zig build
          zig build test --summary all
      - name: Shellcheck the tooling scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck tools/*.sh
